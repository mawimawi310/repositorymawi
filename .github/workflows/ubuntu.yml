name: Ubuntu Desktop RDP & SSH

on:
  workflow_dispatch:

jobs:
  ubuntu-rdp-ssh:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install Desktop Environment & XRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp
          
          echo xfce4-session > ~/.xsession
          sudo cp ~/.xsession /etc/skel/
          
          sudo adduser xrdp ssl-cert
          sudo systemctl restart xrdp

      - name: Enable SSH Password Authentication
        run: |
          # Memaksa SSH server untuk menerima login menggunakan password
          sudo bash -c 'echo "PasswordAuthentication yes" > /etc/ssh/sshd_config.d/99-allow-pass.conf'
          sudo bash -c 'echo "KbdInteractiveAuthentication yes" >> /etc/ssh/sshd_config.d/99-allow-pass.conf'
          sudo systemctl restart ssh

      - name: Set User Password
        run: |
          # Mengubah password menggunakan rahasia dari GitHub Secrets
          echo "runner:${{ secrets.RDP_PASSWORD }}" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Install & Setup Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-ubuntu-$GITHUB_RUN_ID

      - name: Maintain Connection & Show Output
        run: |
          TS_IP=$(tailscale ip -4)
          
          echo -e "\n======================="
          echo "=== UBUNTU READY ==="
          echo "======================="
          echo "IP Address : $TS_IP"
          echo "Username   : runner"
          echo "Password   : (Gunakan password dari secret RDP_PASSWORD Anda)"
          echo "=======================\n"
          
          while true; do
            echo "[$(date)] Mesin Ubuntu Aktif..."
            sleep 300
          done
